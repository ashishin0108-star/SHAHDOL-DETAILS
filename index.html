          <div class="bg-white p-6 rounded-xl shadow"><h3 class="font-bold text-xl">भाषा</h3><p>हिंदी और बघेली</p></div>
        </div>`
    },

        <img class="w-full max-h-96 object-cover rounded-xl mt-6" src="https://images.unsplash.com/photo-1606293926075-69a00dbfde81" alt="Historical architecture">

        <p class="mt-3">विराट मंदिर और क्षेत्र के अन्य पुरातात्विक स्थलों के बारे में जानकारी यहाँ जोड़ें।</p>`
    },

    "tourism-and-places": {
      title: "Tourism & Places",
      hindi: "पर्यटन स्थल",
      content: `
        <h2 class="text-3xl font-bold text-amber-800 mb-5">शहडोल के प्रमुख पर्यटन स्थल</h2>
        <div class="grid md:grid-cols-3 gap-6">
          <div class="bg-white rounded-xl shadow overflow-hidden">
            <img class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1548013146-72479768bada">
            <div class="p-5"><h3 class="font-bold text-xl">विराट मंदिर</h3><p>प्राचीन मंदिर और ऐतिहासिक विरासत।</p></div>
          </div>
          <div class="bg-white rounded-xl shadow overflow-hidden">
            <img class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1433086966358-54859d0ed716">
            <div class="p-5"><h3 class="font-bold text-xl">प्राकृतिक स्थल</h3><p>शहडोल की प्राकृतिक सुंदरता।</p></div>
          </div>
          <div class="bg-white rounded-xl shadow overflow-hidden">
            <img class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
            <div class="p-5"><h3 class="font-bold text-xl">बाणसागर बांध</h3><p>बाणसागर परियोजना और जलाशय।</p></div>
          </div>
        </div>`
    },

    "district-admin-and-services": {
      title: "District Administration",
      hindi: "जिला प्रशासन एवं सेवाएँ",
      content: `
        <h2 class="text-3xl font-bold text-amber-800 mb-5">जिला प्रशासन एवं सेवाएँ</h2>
        <div class="grid md:grid-cols-3 gap-5">
          <div class="bg-white p-6 rounded-xl shadow"><h3 class="font-bold text-xl">कलेक्टर कार्यालय</h3><p>जिला प्रशासन की जानकारी।</p></div>
          <div class="bg-white p-6 rounded-xl shadow"><h3 class="font-bold text-xl">तहसील कार्यालय</h3><p>राजस्व एवं तहसील सेवाएँ।</p></div>
          <div class="bg-white p-6 rounded-xl shadow"><h3 class="font-bold text-xl">सरकारी सेवाएँ</h3><p>नागरिक सेवाओं की जानकारी।</p></div>
        </div>`
    },

    "education-and-health": {
      title: "Education & Health",
      hindi: "शिक्षा एवं स्वास्थ्य",
      content: `
        <h2 class="text-3xl font-bold text-amber-800 mb-5">शिक्षा एवं स्वास्थ्य</h2>
        <div class="grid md:grid-cols-2 gap-6">
          <div class="bg-white p-6 rounded-xl shadow">
            <h3 class="text-2xl font-bold">शिक्षा</h3>
            <p class="mt-3">स्कूल, कॉलेज, विश्वविद्यालय एवं अन्य शिक्षण संस्थानों की जानकारी।</p>
          </div>
          <div class="bg-white p-6 rounded-xl shadow">
            <h3 class="text-2xl font-bold">स्वास्थ्य</h3>
            <p class="mt-3">अस्पताल, स्वास्थ्य केंद्र एवं चिकित्सा सुविधाओं की जानकारी।</p>
          </div>
        </div>`
    },

    "culture-and-festivals": {
      title: "Culture & Festivals",
      hindi: "संस्कृति एवं त्योहार",
      content: `
        <h2 class="text-3xl font-bold text-amber-800 mb-5">शहडोल की संस्कृति</h2>
        <p class="text-lg leading-8">शहडोल की पहचान इसकी जनजातीय संस्कृति, लोकगीत, पारंपरिक नृत्य, खानपान और त्योहारों से है।</p>
        <div class="grid md:grid-cols-2 gap-5 mt-6">
          <div class="bg-white rounded-xl p-6 shadow"><h3 class="text-xl font-bold">लोक नृत्य</h3><p>स्थानीय लोक नृत्य और संगीत।</p></div>
          <div class="bg-white rounded-xl p-6 shadow"><h3 class="text-xl font-bold">त्योहार</h3><p>स्थानीय पर्व एवं उत्सव।</p></div>
        </div>`
    },

    "news-tenders-and-events": {
      title: "News & Events",
      hindi: "समाचार एवं निविदाएँ",
      content: `
        <h2 class="text-3xl font-bold text-amber-800 mb-5">शहडोल समाचार एवं अपडेट</h2>
        <div class="bg-white rounded-xl p-6 shadow">
          <h3 class="font-bold text-xl">जिला समाचार</h3>
          <p class="mt-2">यहाँ नवीनतम समाचार और आधिकारिक घोषणाएँ जोड़ें।</p>
        </div>
        <div class="bg-white rounded-xl p-6 shadow mt-5">
          <h3 class="font-bold text-xl">निविदाएँ (Tenders)</h3>
          <p class="mt-2">यहाँ निविदाओं की जानकारी और PDF लिंक जोड़ें।</p>
        </div>`
    },

    "contact-and-directory": {
      title: "Contact & Directory",
      hindi: "संपर्क एवं निर्देशिका",
      content: `
        <h2 class="text-3xl font-bold text-amber-800 mb-5">संपर्क करें</h2>
        <div class="bg-white p-6 rounded-xl shadow max-w-2xl">
          <h3 class="text-xl font-bold">SHAHDOL DETAILS</h3>
          <p class="mt-3">शहडोल, मध्य प्रदेश, भारत</p>
          <form class="mt-5 space-y-4" id="contactPageForm">
            <input required class="border p-3 rounded w-full" placeholder="आपका नाम">
            <input required type="email" class="border p-3 rounded w-full" placeholder="ईमेल">
            <textarea required class="border p-3 rounded w-full" placeholder="अपना संदेश लिखें"></textarea>
            <button class="bg-amber-700 text-white px-6 py-3 rounded" type="submit">संदेश भेजें</button>
          </form>
        </div>`
    }

  };

  function openPage(page, updateURL = true) {

    if (page === "home" || !pages[page]) {
      main.innerHTML = homeContent;
      page = "home";
    } else {
      const data = pages[page];

      main.innerHTML = `
        <section class="min-h-screen bg-amber-50 py-12 px-5">
          <div class="max-w-7xl mx-auto">
            <div class="bg-white p-4 rounded-lg shadow-sm mb-8">
              <a href="?page=home" data-page="home" class="text-amber-800 font-bold">Home</a>
              <span class="mx-2">/</span>
              <span>${data.title}</span>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 md:p-10">
              <h1 class="text-4xl font-bold text-amber-800 mb-2">${data.title}</h1>
              <p class="text-gray-500 mb-8">${data.hindi}</p>
              <div class="text-gray-700">${data.content}</div>
            </div>
          </div>
        </section>`;

      const form = document.getElementById("contactPageForm");
      form?.addEventListener("submit", function(e) {
        e.preventDefault();
        alert("आपका फॉर्म भर दिया गया है। इसे भेजने के लिए सर्वर कनेक्शन जरूरी है।");
        form.reset();
      });
    }

    if (updateURL) {
      history.pushState({page}, "", "?page=" + page);
    }

    document.querySelectorAll("[data-path]").forEach(link => {
      const active = link.dataset.path === page;
      link.classList.toggle("bg-primary", active);
      link.classList.toggle("text-on-primary", active);
      link.classList.toggle("font-bold", active);
      link.setAttribute("href", "?page=" + link.dataset.path);
    });

    window.scrollTo({top: 0, behavior: "smooth"});
  }

  // Navigation menu clicks
  document.addEventListener("click", function(e) {
    const link = e.target.closest("[data-path], [data-page]");
    if (!link) return;

    const page = link.dataset.path || link.dataset.page;
    if (!page) return;

    e.preventDefault();
    openPage(page);
  });

  // Browser Back / Forward
  window.addEventListener("popstate", function() {
    const page = new URLSearchParams(location.search).get("page") || "home";
    openPage(page, false);
  });

  // Open page from URL
  const initialPage = new URLSearchParams(location.search).get("page") || "home";
  openPage(initialPage, false);

});
</script>
</body>
</html>
